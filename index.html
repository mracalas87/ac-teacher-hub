<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The System</title>
<style>
:root{--bg:#F4F1EA;--ink:#1F2430;--card:#FFFFFF;--line:#D9D3C7;--muted:#5A6070;--a:#1F6FEB;--b:#0F8A5F}
@media (prefers-color-scheme:dark){:root{--bg:#171A21;--ink:#F2F0EA;--card:#222733;--line:#38404F;--muted:#A9B0BF;--a:#6EA8FF;--b:#4FD1A0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:980px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 32px;font-size:1.05rem}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
a.card,button.card{display:flex;font:inherit;text-align:left;cursor:pointer;width:100%;flex-direction:column;gap:10px;min-height:230px;padding:26px;border-radius:20px;background:var(--card);border:2px solid var(--line);color:inherit;text-decoration:none;border-top:8px solid var(--c)}
a.card:hover,a.card:focus-visible,button.card:hover,button.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14);outline:3px solid var(--c);outline-offset:2px}
.card h2{margin:0;font-size:1.6rem}
.card p{margin:0;color:var(--muted);flex:1}
.go{align-self:flex-start;padding:12px 22px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:1.05rem}
.card.off{--c:#8A8F9C;pointer-events:none;opacity:.8}
.tag{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
dialog{border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:28px;max-width:360px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(0,0,0,.55)}dialog h2{margin:0 0 6px}dialog p{margin:0 0 14px;color:var(--muted)}#pinIn{width:100%;font-size:2rem;letter-spacing:.5em;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}#pinErr{min-height:1.4em;color:#C0392B;font-weight:700;margin:8px 0}.row{display:flex;gap:10px}.row button{flex:1;min-height:52px;border-radius:999px;border:2px solid var(--ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--card);color:var(--ink)}.row button.ok{background:var(--a);border-color:var(--a);color:#fff}
.back{min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;margin-bottom:18px}[hidden]{display:none!important}
footer{margin-top:36px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <div id="home">
  <h1>The System</h1>
  <p class="sub">Everything in one place. Choose a part of the system.</p>
  <div class="grid" id="grid"></div>
  </div>
  <div id="sub" hidden>
  <button type="button" class="back" id="back">&larr; Back to The System</button>
  <h1>Assessment and Evidence</h1>
  <p class="sub">Choose where to go. These open in a new tab.</p>
  <div class="grid" id="subgrid"></div>
  </div>
  <dialog id="pin" aria-labelledby="pinT"><form id="pinForm"><h2 id="pinT">Enter PIN</h2><p>This part of the system is locked.</p><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="PIN"><div id="pinErr" role="alert"></div><div class="row"><button type="button" id="pinCancel">Cancel</button><button type="submit" class="ok">Unlock</button></div></form></dialog>
<footer>Each tool opens in the same tab. Use your browser's back button to return here.</footer>
</main>
<script>
var TOOLS=[
  {tag:'Grade and report',title:'Markbook',text:'Mark objectives, track attainment and write pupil reports.',color:'#1F6FEB',btn:'Open Markbook',kind:'mb',url:'https://ac-markbook.vercel.app'},
  {tag:'Assess and evidence',title:'Assessment and Evidence',text:'Pupil portfolio site, pupil folders and pupil data. Only you can see this.',color:'#0F8A5F',btn:'Enter',kind:'ae'}
];
var HASH='9902f4f3993245608527ce9ff26fddb075c76164f56839139556b3be28b8cacf',V={s:'YMQQhi5hj+ujVyP/q9sivg==',i:'IvEPvcwIAcg2nmuU',c:'K2+gRUHppDPHpARBRylwTmVMS6lYVo2hjEE+2vgxucreqCBLohg2HLvkNUQd2hHuPlCd3kz4i1IQe0P/fOkkD18pbycwynfcqSzxUhni73R5JGHgQPu2rNAK7iFfl0ScEx7lQh8iaUN2fMAkPbFIxg4lLrO7PM62JNa38xsZf8QaAGL0tJ5Z1XXilIN5ilWZz31V7hnlJ1GeYZnkmDmrdKO7VxQJFjiJ9o5Ti0yT2YLOS4o1X/v2w8KXYLMT+VTG3a4KjIybsfAX453Llc4HDHU2rtbLBthzX0MPopWDrc+FQ65wSB+OMwZoZVN/VJ83iLqrjz711XeGRnL9JfNXsGJeqSTY39zmwiXWZ8ZWv8rOZmjLrq4tVyTn4vXYaDrbDeklQUTuaOaL4J0Kme9NlGbhQgVVMfu4lK7X4WkR3GbU60DHItGD2EZ66bImLs6gns3IZcXLYJQeW4nK7pQrSyQJTOt5+KfIlTwVan31lTNnUE020v5ZR/JgirKjkcpp2K4Dho3Rez2+yN3zkdQNl2nwy1403dpk3R5QYX91R21+B0toVNRtM62ct1IdBJ3hrqQkkSSL48D7zVCJIrPr3aTC0OMyCTYP5BuqywVU1MPO8JTXz+8w84LAGJ64qSFDuSSrvvi3iFTg/Xg7W50xLVIVwecJXS3UCxNcHvXnWINMenckRSdlRCUIkdi5aWB2lkcJz7OuKKFkkRpXq48sS/T6fC7oKqKgLwsgn+LghSmKbxILe257ouB2nK2jw2p9wCy3rFdl28o3WUPR/Ze/uPPHNPq7HhUoTg+qe6W9ebzXdKFF9aTWdJUtXsgzT9eTEsKT9bOuldLgCAQirACGS18YEpN7WN68WnIQC1Luay+TCTQCdw4kSNGLCyzEt5niEpoJTztnE+5BTFpJjz6enFGzIvf6/MhBafQ6Un+QyrGyOLtZ4bMegKRt1aT5koZa8Vxmmo6GD2iXsrbr3HbTUW8vEKEzBqoM6hESlZDqjj8UCdvWuFMRq0PvJDunTZ0bM0xxZWyfuowRKnX9MSxY'};
function d64(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function vault(pin){return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(V.s),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:d64(V.i)},k,d64(V.c))}).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
function check(kind,pin){return kind==='ae'?vault(pin):sha('system:'+pin).then(function(h){if(h!==HASH)throw 0;return true})}
function saved(){try{return sessionStorage.getItem('sys-pin')||''}catch(e){return ''}}
function save(p){try{sessionStorage.setItem('sys-pin',p)}catch(e){}}
var g=document.getElementById('grid'),home=document.getElementById('home'),sub=document.getElementById('sub'),sg=document.getElementById('subgrid'),dlg=document.getElementById('pin'),inp=document.getElementById('pinIn'),err=document.getElementById('pinErr'),pend=null,busy=false;
function card(t,tag,extra){var a=document.createElement(tag);a.className='card';a.style.setProperty('--c',t.color);a.innerHTML='<span class="tag"></span><h2></h2><p></p><span class="go"></span>';a.querySelector('.tag').textContent=(extra?'🔒 ':'')+t.tag;a.querySelector('h2').textContent=t.title;a.querySelector('p').textContent=t.text;a.querySelector('.go').textContent=t.btn;return a}
function proceed(kind,res,t){if(kind==='mb'){location.href=t.url;return}
  sg.innerHTML='';res.forEach(function(p){var a=card(p,'a');a.href=p.url;a.target='_blank';a.rel='noopener';sg.appendChild(a)});home.hidden=true;sub.hidden=false;window.scrollTo(0,0)}
function ask(t){pend=t;var p=saved();if(p){check(t.kind,p).then(function(r){proceed(t.kind,r,t)},function(){show()});return}show()}
function show(){inp.value='';err.textContent='';dlg.showModal();inp.focus()}
document.getElementById('pinForm').addEventListener('submit',function(e){e.preventDefault();if(busy)return;busy=true;var p=inp.value.trim();err.textContent='Checking…';
  check(pend.kind,p).then(function(r){save(p);busy=false;dlg.close();proceed(pend.kind,r,pend)},function(){busy=false;err.textContent='That PIN is not right. Try again.';inp.value='';inp.focus()})});
document.getElementById('pinCancel').addEventListener('click',function(){dlg.close()});
document.getElementById('back').addEventListener('click',function(){sub.hidden=true;home.hidden=false;sg.innerHTML=''});
TOOLS.forEach(function(t){var a=card(t,'button',1);a.type='button';a.addEventListener('click',function(){ask(t)});g.appendChild(a)});
</script>
</body>
</html>
